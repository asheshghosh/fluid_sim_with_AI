[project]
name = "fluid-ai-sim"
version = "0.1.0"
description = "Hybrid Navier-Stokes simulator with a neural fast-rollout surrogate."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "matplotlib>=3.8",
]

[project.scripts]
fluid-sim = "fluid_ai_sim.simulate:main"
fluid-train = "fluid_ai_sim.train_surrogate:main"
fluid-compare = "fluid_ai_sim.compare_modes:main"
fluid-train-incompressible = "fluid_ai_sim.train_incompressible_surrogate:main"
fluid-compare-incompressible = "fluid_ai_sim.compare_incompressible_modes:main"
fluid-train-heat = "fluid_ai_sim.train_heat_surrogate:main"
fluid-compare-heat = "fluid_ai_sim.compare_heat_modes:main"
fluid-train-active-nematic = "fluid_ai_sim.train_active_nematic_surrogate:main"
fluid-compare-active-nematic = "fluid_ai_sim.compare_active_nematic_modes:main"

[tool.setuptools.packages.find]
include = ["fluid_ai_sim*"]
